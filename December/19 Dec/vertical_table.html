<html>
<head>
    <title>Vertical Table Example</title>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        
        }
        th, td {
            text-align: center;
        }
        tr{
            text-align: center;

        }
        tr:hover {
            background-color: #c98b27;
        }
        th:hover {
            background-color: #f4a261;
        }
        /*tr:nth-child(even) {
            background-color: #e9c46a;
        }*/

    </style>

    <table border="0" cellspacing="10" cellpadding="5" style="width: 100%;">
        <tr>
            <th style="width: 50%;"> ID </th>
            <td> 1 </td>
            <td> 2 </td>
        </tr>
        <tr>
            <th style="width: 25%;"> Name </th>
            <td> Krushna </td>
            <td> Ovee </td>
        </tr>
        <tr> 
            <th style="width: 25%;"> Age </th>
            <td> 18 </td>
            <td> 18 </td>
        </tr>
    </table>
</html>
