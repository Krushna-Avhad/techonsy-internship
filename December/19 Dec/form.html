<html>
    <caption> Form Example </caption>
    <Form>
        <label for="name"> Name: <sup>*</sup></label>
        <input type="text" id="name" name="name"><br><br>
        Email: <sup>*</sup>
        <input type="email" id="Email" name="email"><br><br>
        Password:
        <input type="password" id="password" name="password"><br><br>
        Room type:
        <select>
            <option value="Single"> Single </option>
            <option value="Double"> Double </option>
        </select><br><br>
        Arrival Date:
        <input type="date" id="date" name="date"><br><br>
        Departure Date:
        <input type="date" id="date" name="date"><br><br>
        
        Free Pickup:
        <input type="radio" id="yes" name="pickup" value="yes"> Yes
        <input type="radio" id="no" name="pickup" value="no"> No <br><br>
        Flight Number:
        <input type="text" id="flight" name="flight"><br><br>
        Special Requests:
        <input type ="text" id="requests" name="requests"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </Form>
</html>
