<!--
//font property
The font property is a shorthand property for setting font-style, font-variant, font-weight, font-size, line-height, and font-family.
//font-style
The font-style property specifies the font style for a text. The default value is normal. Other values are italic and oblique.
//font-variant
The font-variant property specifies whether or not a text should be displayed in small-caps font. The default value is normal. The other value is small-caps.
//font-weight
The font-weight property specifies the weight (or boldness) of the font. The default value is normal. Other values are bold, bolder, lighter, or a number between 100 and 900.
//font-size
The font-size property specifies the size of the font. The default value is medium. Other values can be in length units (px, em, rem, etc.) or keywords (xx-small, x-small, small, medium, large, x-large, xx-large).
//font family
The font-family property specifies the font family for a text. You can specify multiple font families as a fallback system. The default value is usually Times New Roman or serif.
//gogle fonts
Google Fonts is a library of over 1,000 free licensed font families and APIs for conveniently using the fonts via CSS and Android. You can easily add Google Fonts to your web pages by including a link to the desired font in the <head> section of your HTML document.
