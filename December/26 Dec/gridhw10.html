<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact CSS Grid Layout</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #1f1f1f;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* MAIN CONTAINER */
.container {
    width: 1000px;
    height: 460px;
    padding: 20px;
    background: #2b2f3a;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 15px;
}

/* COMMON BOX */
.box {
    border-radius: 6px;
}

/* ROW 1 */
.box1 {
    background: #ff5c5c;
    grid-column: 1 / 3;
}

.box2 {
    background: #00a884;
}

.box3 {
    background: #ffb26b;
}

/* ROW 2 */
.box4 {
    background: #ff9f68;
}

.box5 {
    background: #20c997;
}

.box6 {
    background: #3ee4c1;
}

/* ROW 3 */
.box7 {
    background: #ffb26b;
    grid-column: 1 / 3;
    grid-row: 3 / 5;
}

.box8 {
    background: #3ee4c1;
}

.box9 {
    background: #ff5c5c;
}

/* ROW 4 */
.box10 {
    background: #00a884;
}

.box11 {
    background: #3ee4c1;
    grid-column: 1 / 4;
}

.box12 {
    background: #ffb26b;
}
</style>
</head>

<body>
<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>

    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>

    <div class="box box7"></div>
    <div class="box box8"></div>
    <div class="box box9"></div>

    <div class="box box10"></div>
    <div class="box box11"></div>
    <div class="box box12"></div>
</div>
</body>
</html>
