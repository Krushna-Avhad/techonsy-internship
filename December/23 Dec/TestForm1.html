<html>
    <link rel="stylesheet" type="text/css" href="testform1.css" />
    <head>
        <title>Test Form</title>
    </head>
    <body>
        <div>

        
        <form>
            Full Name: 
            <input type="text" name="fullname" placeholder="Enter Full Name"/><br /><br>
            Email: 
            <input type="text" name="email" placeholder="Enter Email"/><br /><br>
            Phone Number: 
            <input type="text" name="phonenumber" placeholder="Enter Phone Number"/><br /><br>
            Age: 
            <br>
            <input type="radio" name="Age"/> 18 <br />
            <input type="radio" name="Age"/> 19-30  <br />
            <input type="radio" name="Age"/> 31-50 <br />
            <input type="radio" name="Age"/> 51+ <br /><br>
            Education: 
            <br>
            <input type="checkbox" name="Education"/> High School <br />
            <input type="checkbox" name="Education"/> Some College <br />
            <input type="checkbox" name="Education"/> Associate's Degree <br />
            <input type="checkbox" name="Education"/> Bachelor's Degree <br /><br>
            Appointemnt Date:
            <input type="date" name="appointmentdate" placeholder="Enter the Appointment Date"/><br /><br>
            Reason for Appointment:
            <select name="reasonforappointment">
                <option value="select">--Select--</option>
                <option value="consultation">Consultation</option>
                <option value="followup">Follow-up</option>
                <option value="routinecheck">Routine Check</option>
                <option value="emergency">Emergency</option>
            </select><br /><br>
            Message:
            <input type="text" name="message" placeholder="Enter your message here"/><br /><br>
           <center>
            <input type="submit" value="Submit Form"/>
           </center>
        </form>
        </div>
    </body>

</html>
