<!-- text converter - on string particularly 
initialize
capitalise
count
tolowercase
touppercase -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Converter</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold text-center mb-4">Text Converter</h1>

    <textarea
      id="textInput"
      class="w-full h-32 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Enter your text here..."
    ></textarea>

    <div class="grid grid-cols-2 gap-3 mt-4">
      <button
        onclick="initializeText()"
        class="bg-gray-500 text-white py-2 rounded-lg hover:bg-gray-600"
      >
        Initialize
      </button>

      <button
        onclick="capitalizeText()"
        class="bg-indigo-500 text-white py-2 rounded-lg hover:bg-indigo-600"
      >
        Capitalize
      </button>

      <button
        onclick="toLowerCaseText()"
        class="bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600"
      >
        Lowercase
      </button>

      <button
        onclick="toUpperCaseText()"
        class="bg-green-500 text-white py-2 rounded-lg hover:bg-green-600"
      >
        Uppercase
      </button>
    </div>

    <div class="mt-4 text-sm text-gray-700">
      <p>Characters: <span id="charCount">0</span></p>
      <p>Words: <span id="wordCount">0</span></p>
    </div>
  </div>

  <script>
    const textInput = document.getElementById("textInput");
    const charCount = document.getElementById("charCount");
    const wordCount = document.getElementById("wordCount");

    textInput.addEventListener("input", updateCount);

    function updateCount() {
      const text = textInput.value;
      charCount.textContent = text.length;

      const words =
        text.trim() === ""
          ? 0
          : text.trim().split(/\s+/).length;

      wordCount.textContent = words;
    }

    function initializeText() {
      textInput.value = "";
      updateCount();
    }

    function capitalizeText() {
      if (!textInput.value) return;
      textInput.value =
        textInput.value.charAt(0).toUpperCase() +
        textInput.value.slice(1);
      updateCount();
    }

    function toLowerCaseText() {
      textInput.value = textInput.value.toLowerCase();
      updateCount();
    }

    function toUpperCaseText() {
      textInput.value = textInput.value.toUpperCase();
      updateCount();
    }
  </script>

</body>
</html>
