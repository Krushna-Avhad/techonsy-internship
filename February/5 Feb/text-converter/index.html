<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TypeConverter</title>
</head>
<body>
    <div class="container">
        <h1> Text Converter </h1>

        <textarea id="textInput" placeholder="Enter your text here!"></textarea>

        <div class="buttons">
            <button class="btn-reset" onclick="initializeText()"> Reset </button>
            <button class="btn-capitalize" onclick="capitalizeText()"> Capitalize </button>
            <button class="btn-lower" onclick="toLowerCaseText()"> Lowercase </button>
            <button class="btn-upper" onclick="toUpperCaseText()"> Uppercase </button>
        </div>

        <div class="count">
            <p>Characters: <span id="charCount">0</span></p>
            <p>Words: <span id="wordCount">0</span></p>
        </div>

        <script src="script.js"> </script>
    </div>
</body>
</html>
