    <h1>Student Info</h1>
    <input type="text" id="item" placeholder="Enter student name">
    <button onclick="addItem()">Add Student</button>
    <p id="list"></p>

    <script>
        let students = [];
        function addItem() {
            let val = document.getElementById("item").value;
            students.push(val);
            // document.getElementById("list").innerText = students.join(", ");
            document.getElementById("list").innerHTML = students.join("<br>");
        }
    </script>
