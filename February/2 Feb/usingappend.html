<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Operations</title>
</head>
<body>

    Name <input type="text" id="nameInput" placeholder="Enter name">
    Marks <input type="number" id="marksInput" placeholder="Enter marks">
    Subject <input type="text" id="subjectInput" placeholder="Enter subject">

    <button onclick="addStudent()">Add Student</button>
    <button onclick="displayStudents()">Display Students Row</button>

    <h2>Student Records</h2>

    <div id="tableContainer"></div>

    <script>
        let student = [];

        function addStudent() {
            let name = document.getElementById("nameInput").value;
            let marks = document.getElementById("marksInput").value;
            let subject = document.getElementById("subjectInput").value;

            let studentRecord = {
                name: name,
                marks: marks,
                subject: subject
            };

            student.push(studentRecord);
            alert("Student Added");
        }

        function displayStudents() {

            let container = document.getElementById("tableContainer");
            container.innerHTML = ""; // clear old table

            let table = document.createElement("table");
            table.border = "1";

            // ---- Header Row ----
            let headerRow = document.createElement("tr");

            let headers = ["Sr. No.", "Name", "Marks", "Subject"];
            headers.forEach(text => {
                let th = document.createElement("th");
                th.textContent = text;
                headerRow.appendChild(th);
            });

            table.appendChild(headerRow);

            // ---- Data Rows ----
            for (let i = 0; i < student.length; i++) {
                let row = document.createElement("tr");

                let srNo = document.createElement("td");
                srNo.textContent = i + 1;

                let nameTd = document.createElement("td");
                nameTd.textContent = student[i].name;

                let marksTd = document.createElement("td");
                marksTd.textContent = student[i].marks;

                let subjectTd = document.createElement("td");
                subjectTd.textContent = student[i].subject;

                row.appendChild(srNo);
                row.appendChild(nameTd);
                row.appendChild(marksTd);
                row.appendChild(subjectTd);

                table.appendChild(row);
            }

            container.appendChild(table);
        }
    </script>

</body>
</html>
