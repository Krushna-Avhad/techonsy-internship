<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Management System</h1>

<form id="studentForm">
  <input id="name" placeholder="Name" required>
  <input id="s1" type="number" placeholder="Subject 1" required>
  <input id="s2" type="number" placeholder="Subject 2" required>
  <input id="s3" type="number" placeholder="Subject 3" required>
  <button type="submit">Add / Update</button>
</form>

<div class="filters">
  <button onclick="filterStudents('all')">All</button>
  <button onclick="filterStudents('fail')">Fail</button>
  <button onclick="filterStudents('average')">Average</button>
  <button onclick="filterStudents('excellent')">Excellent</button>
</div>

<p id="ratio"></p>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Total</th>
      <th>%</th>
      <th>Result</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<div id="pagination"></div>

<script src="script.js"></script>
</body>
</html>
