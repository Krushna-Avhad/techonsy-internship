<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Management System</title>
</head>
<body>

<h1>Student Management System</h1>

<form id="studentForm">
  <input type="text" id="name" placeholder="Student Name" required />
  <input type="number" id="sub1" placeholder="Subject 1" min="0" max="100" required />
  <input type="number" id="sub2" placeholder="Subject 2" min="0" max="100" required />
  <input type="number" id="sub3" placeholder="Subject 3" min="0" max="100" required />
  <button type="submit">Add / Update</button>
</form>

<div>
  <button onclick="filterByGrade('A')">A</button>
  <button onclick="filterByGrade('B')">B</button>
  <button onclick="filterByGrade('C')">C</button>
  <button onclick="filterByGrade('Fail')">Fail</button>
  <button onclick="resetView()">All</button>
</div>

<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Total</th>
      <th>Percentage</th>
      <th>Grade</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<div>
  <button onclick="prevPage()">Prev</button>
  <span id="pageNo"></span>
  <button onclick="nextPage()">Next</button>
</div>

<div id="ratio"></div>

<script src="d.js"></script>

</body>
</html>
