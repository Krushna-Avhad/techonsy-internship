<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Filter Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        #filters {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 15px;
            background: #ffffff;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        #filters label {
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        #productcontainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product {
            flex: 0 0 calc(33.333% - 20px);
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .product p {
            margin: 4px 0;
            font-size: 14px;
        }

        /* Search Bar Styles */
        #searchContainer {
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        #searchbar {
            width: 100%;
            max-width: 300px;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: box-shadow 0.2s ease;
        }

        #searchbar:focus {
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            border-color: #007bff;
        }

        #searchBtn {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        #searchBtn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }


    </style>
</head>

<body>

<h1>Product Filters</h1>

<div id="searchContainer">
    <input type="text" id="searchbar" placeholder="Search products..." />
    <button id="searchBtn">Search</button>
</div>

<div id="filters">

    <label>
        Max Price ($)
        <input type="range" id="priceFilter" min="0" max="1500" value="1500">
        <strong><span id="priceValue">1500</span></strong>
    </label>

    <label>
        Min Rating
        <select id="ratingFilter">
            <option value="0">All</option>
            <option value="4">4+</option>
            <option value="4.5">4.5+</option>
        </select>
    </label>

    <label>
        Brand
        <select id="brandFilter">
            <option value="all">All</option>
            <option value="apple">Apple</option>
            <option value="samsung">Samsung</option>
            <option value="sony">Sony</option>
            <option value="dell">Dell</option>
            <option value="hp">HP</option>
        </select>
    </label>

    <label>
        Category
        <select id="categoryFilter">
            <option value="all">All</option>
            <option value="phone">Phone</option>
            <option value="laptop">Laptop</option>
            <option value="accessories">Accessories</option>
        </select>
    </label>


    <label>
        Gender
        <select id="genderFilter">
            <option value="all">All</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="unisex">Unisex</option>
        </select>
    </label>

</div>

<div id="productcontainer"></div>

<script>
    const products = [
    { name: "Apple iPhone 12", brand: "apple", category: "phone", gender: "unisex", price: 799, rating: 4.6 },
    { name: "Samsung Galaxy S21", brand: "samsung", category: "phone", gender: "unisex", price: 999, rating: 4.7 },
    { name: "Sony Headphones", brand: "sony", category: "accessories", gender: "men", price: 349, rating: 4.8 },
    { name: "Apple AirPods Pro", brand: "apple", category: "accessories", gender: "women", price: 249, rating: 4.7 },
    { name: "Dell XPS 13", brand: "dell", category: "laptop", gender: "unisex", price: 1099, rating: 4.6 },
    { name: "HP Spectre x360", brand: "hp", category: "laptop", gender: "unisex", price: 1249, rating: 4.5 },

    { name: "Samsung Galaxy Watch 5", brand: "samsung", category: "accessories", gender: "unisex", price: 399, rating: 4.6 },
    { name: "Apple MacBook Air M1", brand: "apple", category: "laptop", gender: "unisex", price: 999, rating: 4.8 },
    { name: "Sony PlayStation 5", brand: "sony", category: "accessories", gender: "men", price: 499, rating: 4.9 },
    { name: "Dell Inspiron 15", brand: "dell", category: "laptop", gender: "unisex", price: 749, rating: 4.4 },
    { name: "HP Pavilion Gaming Laptop", brand: "hp", category: "laptop", gender: "men", price: 899, rating: 4.5 },

    { name: "Apple iPad Pro", brand: "apple", category: "phone", gender: "unisex", price: 1099, rating: 4.7 },
    { name: "Samsung Galaxy Buds Pro", brand: "samsung", category: "accessories", gender: "women", price: 199, rating: 4.6 },
    { name: "Sony Bravia 55\" 4K TV", brand: "sony", category: "accessories", gender: "unisex", price: 1299, rating: 4.7 },
    { name: "Dell UltraSharp Monitor", brand: "dell", category: "accessories", gender: "unisex", price: 599, rating: 4.6 },
    { name: "HP Wireless Mouse", brand: "hp", category: "accessories", gender: "unisex", price: 49, rating: 4.3 },

    { name: "Apple Watch Series 9", brand: "apple", category: "accessories", gender: "women", price: 429, rating: 4.8 },
    { name: "Samsung Galaxy Tab S8", brand: "samsung", category: "phone", gender: "unisex", price: 649, rating: 4.6 },
    { name: "Sony Bluetooth Speaker", brand: "sony", category: "accessories", gender: "unisex", price: 179, rating: 4.5 }
];

    const container = document.getElementById("productcontainer");

    const searchbar = document.getElementById("searchbar");

    const priceFilter = document.getElementById("priceFilter");
    const ratingFilter = document.getElementById("ratingFilter");
    const brandFilter = document.getElementById("brandFilter");
    const genderFilter = document.getElementById("genderFilter");
    const priceValue = document.getElementById("priceValue");
    const categoryFilter = document.getElementById("categoryFilter");


    function search() {
    const keyword = searchbar.value.toLowerCase();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(keyword) ||
        product.brand.toLowerCase().includes(keyword) ||
        product.category.toLowerCase().includes(keyword) ||
        product.description.toLowerCase().includes(keyword)
    );

    // Display results
    container.innerHTML = "";

    if (filtered.length === 0) {
        container.innerHTML = "<p>No products found.</p>";
        return;
    }

    filtered.forEach(product => {
        const div = document.createElement("div");
        div.classList.add("product");
        div.innerHTML = `
            <h2>${product.name}</h2>
            <p><strong>Brand:</strong> ${product.brand}</p>
            <p><strong>Category:</strong> ${product.category}</p>
            <p><strong>Price:</strong> $${product.price}</p>
            <p><strong>Rating:</strong> ⭐ ${product.rating}</p>
            <p><strong>Stock:</strong> ${product.stock > 0 ? product.stock + " available" : "Out of stock"}</p>
            <p><strong>Description:</strong> ${product.description}</p>
        `;
        container.appendChild(div);
    });
    }

    function display(list) {
        container.innerHTML = "";

        list.forEach(p => {
            const div = document.createElement("div");
            div.className = "product";
            div.innerHTML = `
                <h2>${p.name}</h2>
                <p><strong>Brand:</strong> ${p.brand}</p>
                <p><strong>Category:</strong> ${p.category}</p>
                <p><strong>Gender:</strong> ${p.gender}</p>
                <p><strong>Price:</strong> $${p.price}</p>
                <p><strong>Rating:</strong> ⭐ ${p.rating}</p>
            `;
            container.appendChild(div);
        });
    }

    function applyFilters() {
    const filtered = products.filter(p => {
        return (
            p.price <= priceFilter.value &&
            p.rating >= ratingFilter.value &&
            (brandFilter.value === "all" || p.brand === brandFilter.value) &&
            (genderFilter.value === "all" || p.gender === genderFilter.value) &&
            (categoryFilter.value === "all" || p.category === categoryFilter.value)
        );
    });

        display(filtered);
    }


    display(products);

    priceFilter.addEventListener("input", () => {
        priceValue.textContent = priceFilter.value;
        applyFilters();
    });

    ratingFilter.addEventListener("change", applyFilters);
    brandFilter.addEventListener("change", applyFilters);
    genderFilter.addEventListener("change", applyFilters);
    categoryFilter.addEventListener("change", applyFilters);
    searchbar.addEventListener("keyup", search);

</script>

</body>
</html>
