<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student management system</title>
</head>
<body>
    <h1>Student Management System</h1>
    <input type="text" id="inputname" placeholder="Enter Name:">
    <input type="number" id="inputage" placeholder="Enter Age:">
    <input type="text" id="inputgrade" placeholder="Enter Grade(A/B/C)">
    <button onclick="submit()"> Submit </button>
    <div id="container"></div>


    <script> 
    
        let name = document.getElementById("inputname");
        let age = document.getElementById("inputage");
        let grade = document.getElementById("inputgrade");

        let students = [];

        function submit() {
            let student = {
                name: name.value,
                age: age.value,
                grade: grade.value
            }
            students.push(student);
            console.log(students);
            display();
        }

        function display(list){
            let container = document.getElementById("container");
            list.forEach((std) => {
                let div = document.createElement("div");
                Object.entries(std).forEach(([key, value]) => {
                    let p = document.createElement("p");
                    p.innerText = `${key} : ${value}`;
                    div.appendChild(p);
                })
            })
            container.appendChild(div);
        }


    </script>
