<!DOCTYPE html>
<html>
<head>
  <title>Timer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #84fab0, #8fd3f4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .timer-box {
      background: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 15px;
      color: #333;
    }

    #timer {
      font-size: 48px;
      font-weight: bold;
      color: #2e7d32;
    }
  </style>
</head>
<body>

<div class="timer-box">
  <h2>Simple Timer</h2>
  <div id="timer">0</div>
</div>

<script>
  let count = 0;

  setInterval(function () {
    count++;
    document.getElementById("timer").innerText = count;
  }, 1000);
</script>

</body>
</html>
