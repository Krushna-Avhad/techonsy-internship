<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using JavaScript</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="calc2.css">
</head>
<body>

<div class="container">
    <div class="calculator">
        <form name="calculatorForm">
            <div class="display">
                <input type="text" name="display" id="display" readonly>
            </div>
            <div>
                <input type="button" value="AC" onclick="clearDisplay()" class="operator">
                <input type="button" value="DE" onclick="deleteLast()" class="operator">
                <input type="button" value="%" onclick="appendValue('%')" class="operator">
                <input type="button" value="/" onclick="appendValue(' / ')" class="operator">
            </div>
            <div>
                <input type="button" value="7" onclick="appendValue('7')">
                <input type="button" value="8" onclick="appendValue('8')">
                <input type="button" value="9" onclick="appendValue('9')">
                <input type="button" value="*" onclick="appendValue(' * ')" class="operator">
            </div>
            <div>
                <input type="button" value="4" onclick="appendValue('4')">
                <input type="button" value="5" onclick="appendValue('5')">
                <input type="button" value="6" onclick="appendValue('6')">
                <input type="button" value="-" onclick="appendValue(' - ')" class="operator">
            </div>
            <div>
                <input type="button" value="1" onclick="appendValue('1')">
                <input type="button" value="2" onclick="appendValue('2')">
                <input type="button" value="3" onclick="appendValue('3')">
                <input type="button" value="+" onclick="appendValue(' + ')" class="operator">
            </div>
            <div>
                <input type="button" value="0" onclick="appendValue('0')">
                <input type="button" value="." onclick="appendDecimal()">
                <input type="button" value="=" onclick="calculateResult()" class="equal">
            </div>
        </form>
    </div>
</div>

<script>
    function clearDisplay() {
        document.calculatorForm.display.value = '';
    }

    function deleteLast() {
        document.calculatorForm.display.value = document.calculatorForm.display.value.slice(0, -1);
    }

    function appendValue(value) {
        if (document.calculatorForm.display.value === '0') {
            document.calculatorForm.display.value = '';
        }
        document.calculatorForm.display.value += value;
    }

    function appendDecimal() {
        let display = document.calculatorForm.display.value;
        if (!display.includes('.')) {
            document.calculatorForm.display.value += '.';
        }
    }

    function calculateResult() {
        try {
            let result = eval(document.calculatorForm.display.value);
            if (isNaN(result) || result === Infinity || result === -Infinity) {
                throw new Error("Invalid calculation");
            }
            document.calculatorForm.display.value = result;
        } catch (e) {
            document.calculatorForm.display.value = 'Error';
        }
    }
</script>

</body>
</html>
