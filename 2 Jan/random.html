<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2025 to 2026 Transition</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ---------------- RESET ---------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ---------------- BODY ---------------- */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #020617, #000);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* ---------------- YEAR CONTAINER ---------------- */
    .year {
      display: flex;
      gap: 14px;
      font-size: 7rem;
      font-weight: 800;
      color: #e5e7eb;
    }

    .digit {
      position: relative;
      display: inline-block;
    }

    /* ---------------- STATIC DIGITS ---------------- */
    .static {
      animation: reveal 1.2s ease forwards;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(40px);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* ---------------- FALLING 5 ---------------- */
    .fall {
      animation: fallDown 1.8s ease-in forwards;
      animation-delay: 2.5s;
      color: #94a3b8;
    }

    @keyframes fallDown {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(200px) rotate(10deg);
        opacity: 0;
      }
    }

    /* ---------------- ENTERING 6 ---------------- */
    .enter {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      color: #38bdf8;
      text-shadow:
        0 0 15px rgba(56,189,248,0.5),
        0 0 35px rgba(56,189,248,0.4);
      animation: enterUp 1.6s ease-out forwards;
      animation-delay: 3.2s;
    }

    @keyframes enterUp {
      0% {
        transform: translateY(-120px) scale(0.8);
        opacity: 0;
        filter: blur(10px);
      }
      70% {
        transform: translateY(0) scale(1);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

  <div class="year">
    <span class="digit static">2</span>
    <span class="digit static">0</span>
    <span class="digit static">2</span>

    <!-- Transition Digit -->
    <span class="digit">
      <span class="fall">5</span>
      <span class="enter">6</span>
    </span>
  </div>

</body>
</html>
